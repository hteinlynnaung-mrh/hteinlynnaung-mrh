<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e9f2ff" />
  <title>Floating Fluid Stack</title>
  <style>
    :root {
      --ink: #102238;
      --muted: #71829b;
      --blue: #3987ff;
      --lav: #a88bff;
      --glass: rgba(255, 255, 255, .57);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f6fbff 0%, #edf1ff 48%, #e8f8f5 100%);
    }

    body:before,
    body:after {
      position: fixed;
      z-index: -1;
      content: "";
      border-radius: 50%;
      filter: blur(20px);
      opacity: .55;
      animation: drift 13s ease-in-out infinite alternate;
    }

    #neural-canvas {
      position: fixed;
      inset: 0;
      z-index: -4;
      width: 100%;
      height: 100%;
      opacity: .68;
      pointer-events: none;
    }

    body:before {
      width: 36vw;
      height: 36vw;
      top: -10vw;
      left: -8vw;
      background: #bce9ff;
    }

    body:after {
      width: 42vw;
      height: 42vw;
      right: -13vw;
      bottom: -15vw;
      background: #d8c8ff;
      animation-delay: -5s;
    }

    .wrap {
      width: min(1180px, calc(100% - 2rem));
      margin: auto;
      padding: clamp(3rem, 8vw, 7rem) 0 4rem;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .kicker {
      margin: 0 0 .8rem;
      color: #5682be;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(3rem, 8vw, 7rem);
      line-height: .85;
      letter-spacing: -.085em;
    }

    h1 em {
      color: #6c78ed;
      font-style: normal;
    }

    .sub {
      max-width: 330px;
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: .94rem;
    }

    .grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: .8rem;
      grid-auto-rows: 144px;
      perspective: 1200px;
      isolation: isolate;
      --gx: 50%;
      --gy: 50%;
    }

    .grid:before {
      position: absolute;
      inset: -5rem;
      z-index: -2;
      content: "";
      background: radial-gradient(circle at var(--gx) var(--gy), rgba(107, 145, 255, .22), transparent 24%), radial-gradient(circle at 20% 20%, rgba(120, 220, 255, .18), transparent 23%), radial-gradient(circle at 80% 90%, rgba(184, 129, 255, .18), transparent 27%);
      filter: blur(18px);
      transition: background-position .25s ease;
      pointer-events: none;
    }

    .grid:after {
      position: absolute;
      inset: -2rem;
      z-index: -3;
      content: "";
      opacity: .25;
      background-image: radial-gradient(rgba(83, 124, 190, .42) 1px, transparent 1px);
      background-size: 18px 18px;
      mask-image: linear-gradient(to bottom, transparent, black 14%, black 86%, transparent);
      pointer-events: none;
    }

    .item {
      position: relative;
      height: 144px;
      min-height: 0;
      padding: .8rem;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 22px;
      background: var(--glass);
      box-shadow: 0 16px 34px rgba(91, 111, 161, .12), inset 0 1px 0 white;
      backdrop-filter: blur(20px);
      transform-style: preserve-3d;
      transform: translate3d(var(--x, 0), var(--y, 0), 0) rotate(var(--r, 0));
      animation: float var(--speed, 7s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      transition: box-shadow .4s, background .4s;
      will-change: transform;
    }

    .item:before {
      position: absolute;
      width: 130px;
      height: 130px;
      top: -70px;
      right: -40px;
      content: "";
      border-radius: 50%;
      background: var(--tone);
      opacity: .22;
      filter: blur(5px);
      transition: transform .5s;
    }

    .item:after {
      position: absolute;
      inset: 0;
      content: "";
      border-radius: inherit;
      background: linear-gradient(115deg, transparent 25%, rgba(255, 255, 255, .48) 48%, transparent 68%);
      background-size: 220% 100%;
      opacity: 0;
      pointer-events: none;
      animation: glassSweep 6s ease-in-out infinite;
    }

    .badge {
      position: relative;
      display: grid;
      width: 56px;
      min-width: 56px;
      height: 56px;
      min-height: 56px;
      place-items: center;
      border-radius: 16px;
      color: var(--tone);
      background: color-mix(in srgb, var(--tone), white 78%);
      font-size: .82rem;
      font-weight: 900;
      letter-spacing: -.07em;
      box-shadow: 0 8px 16px color-mix(in srgb, var(--tone), transparent 78%);
      animation: badgeBreathe 4s ease-in-out infinite;
    }

    .badge:before {
      position: absolute;
      inset: -5px;
      content: "";
      border: 1px solid color-mix(in srgb, var(--tone), transparent 55%);
      border-radius: inherit;
      opacity: 0;
      transform: scale(.75);
    }

    .badge:after {
      position: absolute;
      inset: -8px;
      content: "";
      border: 1px dashed color-mix(in srgb, var(--tone), transparent 35%);
      border-radius: 50%;
      opacity: .28;
      animation: orbit 8s linear infinite;
    }

    .badge img {
      display: block;
      width: 38px;
      height: 38px;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 3px 4px color-mix(in srgb, var(--tone), transparent 65%));
      animation: logoDrift 3.5s ease-in-out infinite;
    }

    .fallback {
      display: none;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: -.06em;
    }

    .fallback.visible {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      line-height: 1;
    }

    .item:nth-child(3n) .badge img {
      animation-name: logoTilt;
      animation-duration: 4.5s;
    }

    .item:nth-child(3n+1) .badge img {
      animation-name: logoPulse;
      animation-duration: 3s;
    }

    .grid.is-active .item {
      animation-duration: calc(var(--speed) * .68);
    }

    .grid.is-active .item:after {
      opacity: .32;
    }

    .grid.is-active .badge:after {
      opacity: .82;
      animation-duration: 2.4s;
    }

    .grid.is-active .signal:after {
      animation-duration: 1.15s;
    }

    .num {
      position: absolute;
      top: .8rem;
      right: .8rem;
      color: #9ba8bb;
      font-size: .6rem;
      font-variant-numeric: tabular-nums;
    }

    .name {
      position: relative;
      margin: 1.05rem 0 .25rem;
      font-size: .84rem;
      letter-spacing: -.03em;
    }

    .type {
      position: relative;
      color: #8491a5;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .wave {
      position: absolute;
      right: 1.1rem;
      bottom: 1.15rem;
      width: 35px;
      height: 14px;
      opacity: .55;
    }

    .wave span {
      position: absolute;
      bottom: 0;
      width: 5px;
      border-radius: 10px;
      background: var(--tone);
      animation: wave 1.25s ease-in-out infinite;
    }

    .wave span:nth-child(1) {
      left: 0;
      height: 45%
    }

    .wave span:nth-child(2) {
      left: 9px;
      height: 85%;
      animation-delay: .15s
    }

    .wave span:nth-child(3) {
      left: 18px;
      height: 60%;
      animation-delay: .3s
    }

    .wave span:nth-child(4) {
      left: 27px;
      height: 100%;
      animation-delay: .45s
    }

    .signal {
      position: absolute;
      right: .8rem;
      bottom: .8rem;
      width: 42px;
      height: 2px;
      overflow: hidden;
      border-radius: 9px;
      background: color-mix(in srgb, var(--tone), transparent 78%);
    }

    .signal:after {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(90deg, transparent, var(--tone), transparent);
      transform: translateX(-100%);
      animation: signal 2.7s ease-in-out infinite;
    }

    .item:nth-child(3n) .signal:after {
      animation-delay: -1s;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 3rem;
      color: #8290a4;
      font-size: .75rem;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate3d(var(--x, 0), var(--y, 0), 0) rotate(var(--r, 0))
      }

      50% {
        transform: translate3d(var(--x, 0), calc(var(--y, 0) - 12px), 0) rotate(calc(var(--r, 0) * -1))
      }
    }

    @keyframes wave {

      0%,
      100% {
        transform: scaleY(.7);
        opacity: .55
      }

      50% {
        transform: scaleY(1.08);
        opacity: 1
      }
    }

    @keyframes drift {
      to {
        transform: translate(8vw, 5vw) scale(1.12);
      }
    }

    @keyframes badgeBreathe {

      0%,
      100% {
        box-shadow: 0 8px 16px color-mix(in srgb, var(--tone), transparent 78%);
      }

      50% {
        box-shadow: 0 12px 25px color-mix(in srgb, var(--tone), transparent 67%);
      }
    }

    @keyframes logoDrift {

      0%,
      100% {
        transform: translateY(0) rotate(0);
      }

      50% {
        transform: translateY(-3px) rotate(-3deg);
      }
    }

    @keyframes logoTilt {

      0%,
      100% {
        transform: rotate(-4deg) scale(1);
      }

      50% {
        transform: rotate(4deg) scale(1.05);
      }
    }

    @keyframes logoPulse {

      0%,
      100% {
        transform: scale(.92);
      }

      50% {
        transform: scale(1.08);
      }
    }

    @keyframes logoLaunch {
      45% {
        transform: translateY(-8px) scale(1.16) rotate(-8deg);
      }

      100% {
        transform: translateY(-3px) scale(1.06);
      }
    }

    @keyframes logoPop {
      45% {
        transform: scale(1.25) rotate(8deg);
      }

      100% {
        transform: scale(1.08) rotate(0);
      }
    }

    @keyframes halo {
      0% {
        opacity: .75;
        transform: scale(.75);
      }

      100% {
        opacity: 0;
        transform: scale(1.55);
      }
    }

    @keyframes orbit {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes glassSweep {

      0%,
      55% {
        background-position: 220% 0;
        opacity: 0;
      }

      68% {
        background-position: 0 0;
        opacity: .8;
      }

      82%,
      100% {
        background-position: -220% 0;
        opacity: 0;
      }
    }

    @keyframes signal {

      0%,
      35% {
        transform: translateX(-100%);
      }

      70%,
      100% {
        transform: translateX(100%);
      }
    }

    /* Flat original-logo mode: motion comes from the logo, not from shading. */
    body {
      background: #050816;
      color: #f8fafc;
    }

    body:before,
    body:after,
    #neural-canvas,
    .grid:before,
    .grid:after {
      display: none;
    }

    .item {
      color: #f8fafc;
      background: #0b1220;
      border: 2px solid var(--tone);
      box-shadow: none;
      backdrop-filter: none;
      animation: none;
      transform: none;
    }

    .item:before,
    .item:after,
    .badge:before,
    .signal {
      display: none;
    }

    .badge {
      background: #050816;
      border: 2px solid var(--tone);
      color: var(--tone);
      box-shadow: none;
      animation: none;
    }

    .badge:after {
      display: block;
      inset: -8px;
      border: 2px dotted var(--tone);
      opacity: .8;
      animation: orbit 5s linear infinite;
    }

    .badge img {
      filter: none;
      animation: logoIdle 3s ease-in-out infinite;
    }

    .grid.is-active .item {
      border-color: color-mix(in srgb, var(--tone), #b9c9df 50%);
    }

    .grid.is-active .badge {
      border-width: 2px;
    }

    .grid.is-active .badge img {
      animation-duration: 1.25s !important;
    }

    .grid.is-active .name {
      color: var(--tone);
    }

    .item[data-tech="React"] .badge img,
    .item[data-tech="React Native"] .badge img {
      animation: reactSpin 7s linear infinite;
    }

    .item[data-tech="JavaScript"] .badge img,
    .item[data-tech="TypeScript"] .badge img {
      animation: codeBounce 2.4s ease-in-out infinite;
    }

    .item[data-tech="Git"] .badge img,
    .item[data-tech="GitHub"] .badge img {
      animation: branchPulse 2.8s ease-in-out infinite;
    }

    .item[data-tech="MySQL"] .badge img,
    .item[data-tech="PostgreSQL"] .badge img,
    .item[data-tech="MongoDB"] .badge img {
      animation: dataPulse 2.2s ease-in-out infinite;
    }

    .item[data-tech="Docker"] .badge img {
      animation: dockerRock 2.8s ease-in-out infinite;
    }

    .item[data-tech="CSS"] .badge img,
    .item[data-tech="Tailwind CSS"] .badge img {
      animation: styleSlide 2.6s ease-in-out infinite;
    }

    .item[data-tech="Python"] .badge img {
      animation: pythonFloat 3s ease-in-out infinite;
    }

    .item[data-tech="Java"] .badge img,
    .item[data-tech="Spring Boot"] .badge img {
      animation: javaBounce 2.6s ease-in-out infinite;
    }

    .item[data-tech="JLPT N2"] .fallback {
      animation: kanjiWrite 2.8s ease-in-out infinite;
    }

    @keyframes logoIdle {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-3px);
      }
    }

    @keyframes iconHover {
      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.25) rotate(-8deg);
      }

      100% {
        transform: scale(1.08) rotate(0);
      }
    }

    @keyframes reactSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes codeBounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes branchPulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.14) rotate(4deg);
      }
    }

    @keyframes dataPulse {

      0%,
      100% {
        transform: scaleY(1);
      }

      50% {
        transform: scaleY(.78) scaleX(1.12);
      }
    }

    @keyframes dockerRock {

      0%,
      100% {
        transform: rotate(0);
      }

      30% {
        transform: rotate(-8deg);
      }

      70% {
        transform: rotate(8deg);
      }
    }

    @keyframes styleSlide {

      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(4px);
      }
    }

    @keyframes pythonFloat {

      0%,
      100% {
        transform: translateY(0) rotate(0);
      }

      50% {
        transform: translateY(-5px) rotate(-6deg);
      }
    }

    @keyframes javaBounce {

      0%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-6px);
      }

      60% {
        transform: translateY(1px);
      }
    }

    @keyframes kanjiWrite {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    /* One distinct motion signature per original logo. */
    .item[data-tech="HTML"] .badge img {
      animation: htmlScan 2.8s ease-in-out infinite;
    }

    .item[data-tech="CSS"] .badge img {
      animation: cssStretch 3s ease-in-out infinite;
    }

    .item[data-tech="Bootstrap"] .badge img {
      animation: bootstrapTurn 5s ease-in-out infinite;
    }

    .item[data-tech="Tailwind CSS"] .badge img {
      animation: tailwindDash 2.2s ease-in-out infinite;
    }

    .item[data-tech="React"] .badge img {
      animation: reactSpin 6s linear infinite;
    }

    .item[data-tech="Next.js"] .badge img {
      animation: nextFlip 4s ease-in-out infinite;
    }

    .item[data-tech="JavaScript"] .badge img {
      animation: jsJump 2.1s cubic-bezier(.2, .8, .2, 1) infinite;
    }

    .item[data-tech="TypeScript"] .badge img {
      animation: tsType 2.8s ease-in-out infinite;
    }

    .item[data-tech="Python"] .badge img {
      animation: pythonFloat 3s ease-in-out infinite;
    }

    .item[data-tech="Express.js"] .badge img {
      animation: expressSwing 3.4s ease-in-out infinite;
    }

    .item[data-tech="Java"] .badge img {
      animation: javaBounce 2.5s ease-in-out infinite;
    }

    .item[data-tech="Spring Boot"] .badge img {
      animation: springOrbit 4s ease-in-out infinite;
    }

    .item[data-tech="PHP"] .badge img {
      animation: phpFlip 3.5s ease-in-out infinite;
    }

    .item[data-tech="Laravel"] .badge img {
      animation: laravelSlash 2.8s ease-in-out infinite;
    }

    .item[data-tech="React Native"] .badge img {
      animation: nativePulse 2.6s ease-in-out infinite;
    }

    .item[data-tech="Git"] .badge img {
      animation: gitBranch 3s ease-in-out infinite;
    }

    .item[data-tech="GitHub"] .badge img {
      animation: githubBeat 2.2s ease-in-out infinite;
    }

    .item[data-tech="MySQL"] .badge img {
      animation: mysqlDrop 3s ease-in-out infinite;
    }

    .item[data-tech="PostgreSQL"] .badge img {
      animation: postgresTurn 4.5s ease-in-out infinite;
    }

    .item[data-tech="MongoDB"] .badge img {
      animation: mongoBlink 2.7s ease-in-out infinite;
    }

    .item[data-tech="Docker"] .badge img {
      animation: dockerRock 2.8s ease-in-out infinite;
    }

    .item[data-tech="JLPT N2"] .fallback {
      animation: kanjiWrite 2.2s ease-in-out infinite;
    }

    @keyframes htmlScan {

      0%,
      100% {
        transform: translateX(0) skewX(0);
      }

      45% {
        transform: translateX(4px) skewX(-8deg);
      }

      65% {
        transform: translateX(-3px) skewX(5deg);
      }
    }

    @keyframes cssStretch {

      0%,
      100% {
        transform: scaleX(1);
      }

      50% {
        transform: scaleX(1.22) scaleY(.82);
      }
    }

    @keyframes bootstrapTurn {

      0%,
      100% {
        transform: rotate(0) scale(1);
      }

      45% {
        transform: rotate(180deg) scale(.82);
      }

      70% {
        transform: rotate(360deg) scale(1);
      }
    }

    @keyframes tailwindDash {

      0%,
      100% {
        transform: translateX(-4px) rotate(-6deg);
      }

      50% {
        transform: translateX(5px) rotate(6deg);
      }
    }

    @keyframes nextFlip {

      0%,
      100% {
        transform: perspective(100px) rotateY(0);
      }

      45% {
        transform: perspective(100px) rotateY(180deg);
      }

      70% {
        transform: perspective(100px) rotateY(360deg);
      }
    }

    @keyframes jsJump {

      0%,
      100% {
        transform: translateY(0) rotate(0);
      }

      38% {
        transform: translateY(-8px) rotate(-7deg);
      }

      58% {
        transform: translateY(1px) rotate(4deg);
      }
    }

    @keyframes tsType {

      0%,
      100% {
        transform: scaleX(1);
      }

      45% {
        transform: scaleX(.78);
      }

      65% {
        transform: scaleX(1.1);
      }
    }

    @keyframes expressSwing {

      0%,
      100% {
        transform: rotate(0);
      }

      30% {
        transform: rotate(-12deg);
      }

      65% {
        transform: rotate(9deg);
      }
    }

    @keyframes springOrbit {

      0%,
      100% {
        transform: translateY(0) rotate(0);
      }

      50% {
        transform: translateY(-5px) rotate(12deg);
      }
    }

    @keyframes phpFlip {

      0%,
      100% {
        transform: rotateX(0);
      }

      45% {
        transform: rotateX(180deg);
      }

      75% {
        transform: rotateX(360deg);
      }
    }

    @keyframes laravelSlash {

      0%,
      100% {
        transform: translateX(0) rotate(0);
      }

      50% {
        transform: translateX(5px) rotate(-10deg);
      }
    }

    @keyframes nativePulse {

      0%,
      100% {
        transform: scale(.9);
      }

      45% {
        transform: scale(1.18);
      }

      65% {
        transform: scale(1);
      }
    }

    @keyframes gitBranch {

      0%,
      100% {
        transform: rotate(0) translateY(0);
      }

      45% {
        transform: rotate(-8deg) translateY(-4px);
      }

      70% {
        transform: rotate(5deg) translateY(1px);
      }
    }

    @keyframes githubBeat {

      0%,
      100% {
        transform: scale(1);
      }

      18% {
        transform: scale(1.16);
      }

      32% {
        transform: scale(.98);
      }

      48% {
        transform: scale(1.1);
      }
    }

    @keyframes mysqlDrop {

      0%,
      100% {
        transform: translateY(-3px);
      }

      45% {
        transform: translateY(5px);
      }

      65% {
        transform: translateY(0);
      }
    }

    @keyframes postgresTurn {

      0%,
      100% {
        transform: rotate(-4deg);
      }

      50% {
        transform: rotate(12deg) scale(1.08);
      }
    }

    @keyframes mongoBlink {

      0%,
      100% {
        transform: scaleY(1);
      }

      45% {
        transform: scaleY(.72);
      }

      60% {
        transform: scaleY(1.08);
      }
    }

    @media (max-width:1050px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width:760px) {

        display: block

      .sub {

        gap: .55rem;
        grid-auto-rows: 128px
      }

      .item {
        height: 128px;
        min-height: 0;
        padding: .65rem;
        border-radius: 18px
      }

      .badge {
        width: 48px;
        min-width: 48px;
        height: 48px;
        min-height: 48px;
        border-radius: 13px;
        font-size: .78rem
      }

      .badge img {
        width: 32px;
        height: 32px
      }

      .num {
        top: .65rem;
        right: .65rem
      }

      .name {
        margin-top: .8rem;
        font-size: .72rem
      }

      .type {
        font-size: .56rem
      }

      .footer {
        display: block;
        line-height: 2
      }
    }

    @media (max-width:430px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: 145px;
      }

      .item {
        height: 145px;
        min-height: 0
      }

      .name {
        font-size: .82rem
      }

      .type {
        font-size: .62rem
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *:before,
      *:after {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important
      }
    }
  </style>
</head>

<body>
  <canvas id="neural-canvas" aria-hidden="true"></canvas>
  <main class="wrap">
    <header class="hero">
      <div>
        <p class="kicker">a softer developer orbit</p>
        <h1>Tools that<br><em>float.</em></h1>
      </div>
      <p class="sub">A fluid, glassy take on your stack. Every card gently drifts in its own current, while the whole
        page breathes like a living interface.</p>
    </header>
    <section class="grid" id="grid" aria-label="Technology stack"></section>
    <footer class="footer"><span>22 floating skills</span><span>move your pointer through the current ↗</span></footer>
  </main>
  <script>
    const skills = [
      ['HTML', 'markup', '#ff6b35'], ['CSS', 'styling', '#38bdf8'], ['Bootstrap', 'ui system', '#9b6dff'], ['Tailwind CSS', 'styling', '#22d3ee'], ['React', 'frontend', '#61dafb'], ['Next.js', 'frontend', '#f8fafc'], ['JavaScript', 'language', '#f7df1e'], ['TypeScript', 'language', '#3178c6'], ['Python', 'backend', '#ffd43b'], ['Express.js', 'backend', '#a3e635'], ['Java', 'language', '#f89820'], ['Spring Boot', 'backend', '#6db33f'], ['PHP', 'backend', '#777bb4'], ['Laravel', 'backend', '#ff2d20'], ['React Native', 'mobile', '#61dafb'], ['Git', 'versioning', '#f05032'], ['GitHub', 'collaboration', '#f0f6fc'], ['MySQL', 'database', '#00a4e4'], ['PostgreSQL', 'database', '#4169e1'], ['MongoDB', 'database', '#47a248'], ['Docker', 'devops', '#2496ed'], ['JLPT N2', 'learning', '#ff4d9d']
    ];
    const grid = document.querySelector('#grid');
    const logos = { HTML: 'html5', CSS: 'css3', Bootstrap: 'bootstrap', 'Tailwind CSS': 'tailwindcss', React: 'react', 'Next.js': 'nextdotjs', JavaScript: 'javascript', TypeScript: 'typescript', Python: 'python', 'Express.js': 'express', Java: 'openjdk', 'Spring Boot': 'springboot', PHP: 'php', Laravel: 'laravel', 'React Native': 'react', Git: 'git', GitHub: 'github', MySQL: 'mysql', PostgreSQL: 'postgresql', MongoDB: 'mongodb', Docker: 'docker' };
    const fallback = { HTML: '</>', CSS: 'CSS', Bootstrap: 'B', 'Tailwind CSS': '~', React: '⚛', 'Next.js': 'N', JavaScript: 'JS', TypeScript: 'TS', Python: 'Py', 'Express.js': 'EX', Java: '☕', 'Spring Boot': 'SB', PHP: 'php', Laravel: 'LV', 'React Native': 'RN', Git: '⑂', GitHub: 'GH', MySQL: 'SQL', PostgreSQL: 'PG', MongoDB: 'MG', Docker: 'DK', "JLPT N2": '文' };
    const darkModeLogoColors = { 'GitHub': 'f8fafc', 'Next.js': 'f8fafc', 'Express.js': 'e2e8f0' };
    const originalLogoSources = { CSS: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg', Python: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg', Java: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg', PostgreSQL: 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postgresql/postgresql-original.svg' };
    const logo = (name, tone) => logos[name] ? `<img src="${originalLogoSources[name] || `https://cdn.simpleicons.org/${logos[name]}/${(darkModeLogoColors[name] || tone.replace('#', ''))}`}" alt="" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.classList.add('visible')"><span class="fallback">${fallback[name]}</span>` : `<span class="fallback visible">${fallback[name]}</span>`;
    grid.innerHTML = skills.map(([name, type, tone], i) => `<article class="item" data-tech="${name}" style="--tone:${tone};--delay:${(i % 7) * -.42}s;--speed:${6 + (i % 5)}s;--x:${i % 3 === 0 ? '2px' : i % 3 === 1 ? '-2px' : '0px'};--y:${i % 4 === 0 ? '-3px' : i % 4 === 1 ? '4px' : '0px'};--r:${i % 2 ? '-.35deg' : '.35deg'}"><span class="num">${String(i + 1).padStart(2, '0')}</span><div class="badge" aria-label="${name} logo">${logo(name, tone)}</div><h2 class="name">${name}</h2><div class="type">${type}</div><div class="wave"><span></span><span></span><span></span><span></span></div><div class="signal" aria-hidden="true"></div></article>`).join('');
    // Interactive neural field: a single lightweight canvas render loop.
    const canvas = document.querySelector('#neural-canvas'), ctx = canvas.getContext('2d'), pointer = { x: -9999, y: -9999, active: false }; let nodes = [];
    function resizeField() { const dpr = Math.min(devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight; canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); const count = Math.min(72, Math.max(34, Math.floor(w * h / 15000))); nodes = Array.from({ length: count }, () => ({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .28, vy: (Math.random() - .5) * .28, r: Math.random() * 1.8 + 1, p: Math.random() * Math.PI * 2 })); }
    function drawField(time) { const w = innerWidth, h = innerHeight; ctx.clearRect(0, 0, w, h); nodes.forEach(n => { const dx = pointer.x - n.x, dy = pointer.y - n.y, d = Math.hypot(dx, dy) || 1; if (pointer.active && d < 180) { n.vx += dx / d * .003; n.vy += dy / d * .003; } n.x += n.vx; n.y += n.vy; n.vx *= .995; n.vy *= .995; if (n.x < -20) n.x = w + 20; if (n.x > w + 20) n.x = -20; if (n.y < -20) n.y = h + 20; if (n.y > h + 20) n.y = -20; }); for (let i = 0; i < nodes.length; i++)for (let j = i + 1; j < nodes.length; j++) { const a = nodes[i], b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y); if (d < 145) { ctx.strokeStyle = `rgba(89,137,255,${(1 - d / 145) * .18})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } } nodes.forEach(n => { const pulse = (Math.sin(time * .0015 + n.p) + 1) / 2; ctx.fillStyle = `rgba(91,151,255,${.28 + pulse * .3})`; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + pulse * 1.2, 0, Math.PI * 2); ctx.fill(); }); requestAnimationFrame(drawField); }
    addEventListener('resize', resizeField, { passive: true }); addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; }, { passive: true }); addEventListener('pointerleave', () => { pointer.active = false; }, { passive: true }); addEventListener('touchstart', e => { pointer.x = e.touches[0].clientX; pointer.y = e.touches[0].clientY; pointer.active = true; }, { passive: true }); if (canvas.offsetWidth) { resizeField(); requestAnimationFrame(drawField); }
  </script>
